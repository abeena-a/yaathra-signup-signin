<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/signUp.css">
  <link rel="stylesheet" href="css/signIn.css">
</head>

<body>
  <!-- header -->
  <header>
    <div class="head">
      <img src="images/logo1.png" alt="Logo of yaathra">

      <!-- Hamburger icon -->
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="nav-links">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#destination">Destination</a></li>
          <li><a href="#deals">Deals</a></li>
          <li><a href="#contacts">Contacts</a></li>
        </ul>
      </div>
      <button class="btn-header" onclick="window.location.href='SignUp.html'">Sign Up</button>
    </div>
  </header>

  <main>
    <div class="d-flex flex-row section-together">
      <div class="hero-signup" id="home">
        <div class="hero-signup-text">
          <h1>Discover Your Dream <span style="color: rgb(8, 90, 56);">Vacation Today</span></h1>
          <p>Explore breathtaking destinations and enjoy exclusive travel deals with Yaathra</p>
          <button>Explore Now</button>
        </div>
        <div class="hero-signup-image">
          <img src="images/travel-hero-image.png" alt="family photo travel">
        </div>
      </div>


      
      <form>
        <div class="form-container">
          <h1>Sign In</h1>
          <div class="mb-3">
            <input type="email" class="form-control" id="emailId" placeholder="Enter your registered email Id.">
            <span class="ErrorMessage" id="emailError"></span>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="passwordId" placeholder="Enter Your Password.">
            <span class="ErrorMessage" id="passwordError"></span>
          </div>
          <button type="submit" class="btn-header" id="btnSignInId">Sign In</button>
          <p> If you are new to Yaathra, <br>then click here to<a href="SignUp.html"> Sign Up</a></p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const hamburger = document.querySelector(".hamburger");
    const navLinks = document.querySelector(".nav-links");

    hamburger.addEventListener("click", () => {
      navLinks.classList.toggle("active");
      hamburger.classList.toggle("active"); // animate icon
    });
  </script>

  <script src="js/SignIn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</body>
</html>
